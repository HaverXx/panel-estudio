<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex"><title>Panel de estudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ---------- Tema claro (por defecto) ---------- */
:root{
 --fuente:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;
 --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
 --txt:#1d1d1f;--suave:#55555c;--tenue:#7a7a82;
 --vid:255 255 255;            /* color base del cristal */
 --capa:rgba(0,0,0,.045);       /* superficies internas */
 --capa2:rgba(0,0,0,.08);
 --borde:rgba(255,255,255,.65);--linea:rgba(0,0,0,.09);
 --sombra:0 1px 0 rgba(255,255,255,.7) inset,0 10px 30px rgba(20,20,40,.10),0 1px 3px rgba(20,20,40,.08);
 --velo-rgb:255 255 255;
 --vencida:#d70015;--hoy:#c25100;--pronto:#946b00;--normal:#1a8a3a;
 --codigo:#1b1d23;--codigotxt:#e8eaf0;
 --acento:#0a84ff;--op:.58;--blur:28px;--velo:0;
 color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-tema=claro]){
 --txt:#f5f5f7;--suave:#b9b9c4;--tenue:#8e8e99;
 --vid:30 30 36;--capa:rgba(255,255,255,.07);--capa2:rgba(255,255,255,.12);
 --borde:rgba(255,255,255,.14);--linea:rgba(255,255,255,.12);
 --sombra:0 1px 0 rgba(255,255,255,.10) inset,0 12px 36px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.3);
 --velo-rgb:0 0 0;--vencida:#ff6961;--hoy:#ff9f0a;--pronto:#ffd60a;--normal:#32d74b;
 --codigo:#0d0e12;color-scheme:dark}}
:root[data-tema=oscuro]{
 --txt:#f5f5f7;--suave:#b9b9c4;--tenue:#8e8e99;
 --vid:30 30 36;--capa:rgba(255,255,255,.07);--capa2:rgba(255,255,255,.12);
 --borde:rgba(255,255,255,.14);--linea:rgba(255,255,255,.12);
 --sombra:0 1px 0 rgba(255,255,255,.10) inset,0 12px 36px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.3);
 --velo-rgb:0 0 0;--vencida:#ff6961;--hoy:#ff9f0a;--pronto:#ffd60a;--normal:#32d74b;
 --codigo:#0d0e12;color-scheme:dark}

*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:5.5rem;font-size:calc(16px*var(--esc,1))}
body{margin:0;min-height:100vh;background:#1c1c28;color:var(--txt);font-family:var(--fuente);font-size:1rem;line-height:1.5;
 -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:"cv11","ss01"}
/* Fondo y velo */
#fondo{position:fixed;inset:-4rem;z-index:-2;background-size:cover}
#velo{position:fixed;inset:0;z-index:-1;background:rgb(var(--velo-rgb)/var(--velo));pointer-events:none}
main{max-width:var(--ancho,68rem);margin:0 auto;padding:max(1rem,env(safe-area-inset-top)) 1.1rem calc(6.5rem + env(safe-area-inset-bottom))}
@media(min-width:44rem){main{padding-bottom:4rem}}

/* Tipografía */
h1{font-size:clamp(1.9rem,5.5vw,2.7rem);font-weight:800;letter-spacing:-.035em;line-height:1.08;margin:.15rem 0}
h2{font-size:1.35rem;font-weight:700;letter-spacing:-.02em;margin:2.2rem .2rem .8rem}
h3{font-size:1.1rem;font-weight:650;letter-spacing:-.01em;margin:.15rem 0}
h4{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acento);margin:1.4rem 0 .5rem}
a{color:var(--acento);text-decoration:none}a:hover{text-decoration:underline}
p{margin:.5rem 0}
.estado{color:var(--suave);margin:.2rem 0;font-size:.92rem}.estado.aviso{color:var(--hoy);font-weight:600}
small{color:var(--suave)}
code{font-family:var(--mono)}

/* Cristal */
.vidrio,.card,nav#menu,.tema,#acceso form,.vacio{
 background:rgb(var(--vid)/var(--op));
 -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);backdrop-filter:blur(var(--blur)) saturate(180%);
 border:1px solid var(--borde);box-shadow:var(--sombra)}
.card{border-radius:var(--r,22px);padding:1.2rem 1.3rem}
.card.ancha{grid-column:1/-1}
.card.enlace{transition:transform .2s ease,box-shadow .2s ease}
a:hover .card.enlace{transform:translateY(-2px)}
.vacio{border-radius:18px;padding:1.4rem;text-align:center;color:var(--suave);border-style:dashed}
.rejilla{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr))}
.rot{font-size:.74rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--suave);display:flex;align-items:center;gap:.45rem}
.pto{width:.55rem;height:.55rem;border-radius:50%;background:var(--color,var(--normal));flex:none}
.grande{font-size:2.9rem;font-weight:800;line-height:1;color:var(--color,var(--normal));letter-spacing:-.045em;margin:.7rem 0 .45rem;font-variant-numeric:tabular-nums}
.grande small{font-size:1.05rem;font-weight:600;color:var(--suave);letter-spacing:0;margin-left:.15rem}

/* Cabecera */
.cab{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;padding:.8rem .2rem 1rem}
.perfilBtn{display:flex;flex-direction:column;align-items:center;gap:.9rem;padding:2rem 1rem;cursor:pointer;color:var(--txt)}
.perfilBtn:hover{background:rgb(var(--vid)/calc(var(--op) + .1))}
.perfilBtn .logo{width:4.2rem;height:4.2rem;font-size:1.7rem;border-radius:22px}
.cab .fecha{font-size:.8rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--suave)}
.cab .estados{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem}
.pastilla{display:inline-flex;align-items:center;gap:.45rem;font-size:.8rem;font-weight:550;color:var(--suave);padding:.28rem .75rem;border-radius:99px;background:rgb(var(--vid)/calc(var(--op)*.8));border:1px solid var(--borde);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.pastilla::before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:var(--normal)}
.pastilla.aviso{color:var(--hoy)}.pastilla.aviso::before{background:var(--hoy)}
.pastilla.local::before{background:var(--tenue)}
#salir{flex:none}

/* Navegación */
nav#menu{position:sticky;top:max(.6rem,env(safe-area-inset-top));z-index:20;display:flex;gap:.2rem;padding:.3rem;border-radius:99px;width:fit-content;max-width:100%;margin:0 auto 1.4rem;overflow-x:auto}
nav#menu button{display:flex;align-items:center;gap:.5rem;white-space:nowrap;background:transparent;border:0;border-radius:99px;padding:.55rem 1rem;font-size:.92rem;font-weight:600;color:var(--suave)}
nav#menu button:hover{background:var(--capa);color:var(--txt)}
nav#menu button.on{background:var(--acento);color:#fff;box-shadow:0 2px 10px color-mix(in srgb,var(--acento) 50%,transparent)}
.ic{width:1.15rem;height:1.15rem;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
@media(max-width:44rem){
 nav#menu{position:fixed;top:auto;bottom:max(.7rem,env(safe-area-inset-bottom));left:.7rem;right:.7rem;width:auto;justify-content:space-between;border-radius:26px;margin:0;padding:.35rem;overflow:visible}
 nav#menu button{flex:1;flex-direction:column;gap:.15rem;padding:.45rem .1rem;font-size:.6rem;letter-spacing:-.02em;border-radius:20px;min-width:0}
 .ic{width:1.35rem;height:1.35rem}}

/* Controles */
button,.btn{font:inherit;font-weight:600;font-size:.92rem;cursor:pointer;border-radius:12px;border:0;background:var(--capa2);color:var(--txt);padding:.6rem 1.05rem;transition:background .15s,transform .1s,filter .15s}
button:hover{filter:brightness(1.08);background:color-mix(in srgb,var(--capa2) 80%,var(--acento))}button:active{transform:scale(.97)}
button.pri{background:var(--acento);color:#fff}button.pri:hover{background:var(--acento);filter:brightness(1.1)}
button.peq{padding:.32rem .75rem;font-size:.82rem;border-radius:9px}
button.rojo{color:var(--vencida)}
input,select,textarea{font:inherit;width:100%;padding:.65rem .85rem;border-radius:12px;border:1px solid var(--linea);background:rgb(var(--vid)/.45);color:var(--txt)}
input::placeholder{color:var(--tenue)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid color-mix(in srgb,var(--acento) 70%,transparent);outline-offset:2px}
input[type=range]{padding:0;height:1.6rem;accent-color:var(--acento);background:transparent;border:0}
input[type=file]{display:none}
form.f{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));align-items:end}form.f .ancho{grid-column:1/-1}
form.f label,.lbl{display:block;font-weight:600;font-size:.85rem;color:var(--suave);margin-bottom:.3rem}
.botones{display:flex;gap:.6rem;flex-wrap:wrap}

/* Filas */
.fila{position:relative;display:flex;gap:1rem;align-items:center;justify-content:space-between;padding:.85rem 1.1rem .85rem 1.4rem;border-radius:calc(var(--r,22px)*.75);margin:.55rem 0;
 background:rgb(var(--vid)/var(--op));-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);backdrop-filter:blur(var(--blur)) saturate(180%);border:1px solid var(--borde);box-shadow:var(--sombra)}
.fila::before{content:"";position:absolute;left:.55rem;top:.8rem;bottom:.8rem;width:4px;border-radius:4px;background:var(--color,var(--normal))}
.fila .t{font-weight:650;overflow-wrap:anywhere}.fila .t a{color:inherit}.fila .t a:hover{color:var(--acento)}
.fila .s{color:var(--suave);font-size:.88rem}
.fila .cuenta{font-weight:750;color:var(--color);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.fila .cuenta .s{font-weight:500}
.fila .acciones{display:flex;gap:.4rem;margin-top:.4rem;justify-content:flex-end}

/* Chips y progreso */
.chip{display:inline-block;font-size:.76rem;font-weight:650;padding:.2rem .7rem;border-radius:99px;background:color-mix(in srgb,var(--acento) 18%,transparent);color:var(--acento);margin:0 .3rem .3rem 0}
.chip.gris{background:var(--capa2);color:var(--suave)}
.barra{height:7px;background:var(--capa2);border-radius:99px;overflow:hidden;margin:.7rem 0 .4rem}.barra i{display:block;height:100%;background:var(--acento);border-radius:99px;transition:width .4s}
label.chk{display:flex;gap:.8rem;align-items:flex-start;padding:.6rem .2rem;cursor:pointer;border-bottom:1px solid var(--linea)}
label.chk:last-child{border-bottom:0}
label.chk input,.it input[type=checkbox],input.rd{appearance:none;-webkit-appearance:none;width:1.45rem;height:1.45rem;padding:0;margin:.12rem 0 0;border-radius:50%;border:2px solid var(--tenue);background:transparent;flex:none;position:relative;cursor:pointer;transition:background .15s,border-color .15s}
label.chk input:checked,.it input[type=checkbox],input.rd:checked{background:var(--acento);border-color:var(--acento)}
label.chk input:checked::after,.it input[type=checkbox],input.rd:checked::after{content:"";position:absolute;left:.4rem;top:.15rem;width:.32rem;height:.62rem;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(45deg)}
label.chk.hecho span{color:var(--suave)}label.chk.hecho span b,label.chk.hecho .tit{text-decoration:line-through}
.plan pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;margin:.4rem 0 0;line-height:1.6}

/* Logo de asignatura */
.logo{display:inline-flex;align-items:center;justify-content:center;min-width:2.8rem;height:2.8rem;padding:0 .5rem;border-radius:14px;background:var(--color);color:#fff;font-weight:800;font-size:.85rem;letter-spacing:.02em;box-shadow:0 4px 14px color-mix(in srgb,var(--color) 45%,transparent)}
.cabAsig{display:flex;align-items:center;gap:1rem;margin:.4rem 0 1rem}.cabAsig .logo{height:3.4rem;min-width:3.4rem;font-size:1rem;border-radius:16px}
.cabAsig h1{margin:0}
.atras{display:inline-block;margin:.2rem .2rem .4rem;font-weight:600;font-size:.92rem}

/* Selector de semanas */
.semanas{display:flex;gap:.4rem;overflow-x:auto;padding:.35rem;border-radius:20px;margin-bottom:1rem;background:rgb(var(--vid)/calc(var(--op)*.8));border:1px solid var(--borde);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.semanas button{min-width:3.5rem;text-align:center;line-height:1.15;background:transparent;padding:.5rem .6rem;border-radius:14px;color:var(--txt);position:relative}
.semanas button small{display:block;font-weight:500;font-size:.68rem;color:var(--suave)}
.semanas button.on{background:var(--acento);color:#fff}.semanas button.on small{color:rgba(255,255,255,.85)}
.semanas button.actual::after{content:"";position:absolute;top:.3rem;right:.35rem;width:.45rem;height:.45rem;border-radius:50%;background:var(--hoy)}

/* Temas / apuntes */
.tema{border-radius:var(--r,22px);margin:.7rem 0;overflow:hidden}
.tema>summary{cursor:pointer;padding:1rem 1.2rem;font-weight:650;font-size:1.02rem;list-style:none;display:flex;gap:.9rem;align-items:center;justify-content:space-between}
.tema>summary::-webkit-details-marker{display:none}
.tema>summary::after{content:"";width:.55rem;height:.55rem;border:solid var(--suave);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s;flex:none;margin:0 .3rem .25rem 0}
.tema[open]>summary::after{transform:rotate(225deg);margin:.25rem .3rem 0 0}
.tema>summary .r{font-weight:400;color:var(--suave);font-size:.88rem;display:block;margin-top:.1rem;line-height:1.4}
.tema[open]>summary{border-bottom:1px solid var(--linea)}
.cuerpo{padding:.4rem 1.4rem 1.4rem;overflow-x:auto;line-height:1.7;font-size:1rem}
.cuerpo p,.cuerpo li{color:var(--txt)}.cuerpo li{margin:.3rem 0}.cuerpo ul,.cuerpo ol{padding-left:1.4rem}
.cuerpo h4{margin-top:1.8rem}
.cuerpo table{border-collapse:separate;border-spacing:0;width:100%;margin:1rem 0;font-size:.92rem;border:1px solid var(--linea);border-radius:14px;overflow:hidden;line-height:1.5}
.cuerpo th,.cuerpo td{padding:.55rem .8rem;text-align:left;border-bottom:1px solid var(--linea);vertical-align:top}
.cuerpo tr:last-child td{border-bottom:0}
.cuerpo th{background:var(--capa2);font-weight:650;font-size:.8rem;letter-spacing:.03em;text-transform:uppercase;color:var(--suave)}
.cuerpo tbody tr:nth-child(even) td{background:var(--capa)}
.cuerpo code{background:var(--capa2);padding:.12rem .4rem;border-radius:6px;font-size:.86em}
.cuerpo pre{background:var(--codigo);color:var(--codigotxt);padding:2rem 1.1rem 1rem;border-radius:16px;overflow-x:auto;position:relative;margin:1rem 0;line-height:1.6;border:1px solid rgba(255,255,255,.08);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.cuerpo pre::after{content:"";position:absolute;left:1rem;top:.75rem;width:.6rem;height:.6rem;border-radius:50%;background:#ff5f57;box-shadow:1rem 0 #febc2e,2rem 0 #28c840}
.cuerpo pre code{background:none;padding:0;color:inherit;font-size:.85rem;white-space:pre}
.cuerpo pre::before{content:attr(data-lang);position:absolute;top:.55rem;right:4.8rem;font-size:.68rem;font-weight:600;color:#8d93a3;text-transform:uppercase;letter-spacing:.08em}
.cuerpo pre .copiar{position:absolute;top:.4rem;right:.5rem;font-size:.7rem;padding:.2rem .55rem;border-radius:8px;background:rgba(255,255,255,.1);color:#cfd3de}
.nota{background:color-mix(in srgb,var(--acento) 13%,transparent);border:1px solid color-mix(in srgb,var(--acento) 25%,transparent);padding:.8rem 1rem;border-radius:14px;margin:1rem 0;line-height:1.6}
.nota.aviso{background:color-mix(in srgb,var(--hoy) 13%,transparent);border-color:color-mix(in srgb,var(--hoy) 30%,transparent)}
.nota .nl{display:inline-block;font-size:.68rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--acento);margin-right:.6rem}
.nota.aviso .nl{color:var(--hoy)}

/* Bento / inicio */
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:1rem}
.bento>.c5{grid-column:span 5}.bento>.c7{grid-column:span 7}.bento>.c6{grid-column:span 6}.bento>.c12{grid-column:1/-1}
@media(max-width:52rem){.bento>.blk{grid-column:1/-1!important}}
.card .rot{margin-bottom:.2rem}
.mini{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:.75rem 0;border-bottom:1px solid var(--linea)}
.mini:last-of-type{border-bottom:0}
.mini .t{font-weight:600;overflow-wrap:anywhere}.mini .t a{color:inherit}.mini .s{font-size:.85rem;color:var(--suave)}
.mini .cuenta{font-weight:750;color:var(--color);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.mini::before{content:"";width:4px;align-self:stretch;border-radius:4px;background:var(--color);flex:none;margin-right:-.3rem}
.mini>div:first-of-type{flex:1}
.cl{display:flex;gap:.8rem;align-items:center;padding:.55rem .6rem;border-radius:14px}
.cl .b{width:4px;align-self:stretch;min-height:2rem;border-radius:4px;background:var(--color);flex:none}
.cl .h{width:6.4rem;font-size:.82rem;color:var(--suave);font-variant-numeric:tabular-nums;flex:none}
.cl.pasada{opacity:.45}.cl.ahora{background:color-mix(in srgb,var(--color) 18%,transparent)}
.etq{font-size:.66rem;font-weight:750;text-transform:uppercase;letter-spacing:.07em;color:var(--acento);margin-left:.4rem}
.enl{display:inline-block;margin-top:.7rem;font-size:.88rem;font-weight:600}
/* Semana */
.cabSec{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin:.4rem .2rem 1rem}
.cabSec h2{margin:0 0 .2rem}
.diasgrid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr))}
.dia{padding:1rem 1.1rem}.dia.hoy{box-shadow:var(--sombra),0 0 0 2px var(--acento)}
.dia .dn{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;margin-bottom:.4rem}
.dia .dn small{font-weight:500}
.it{display:flex;gap:.65rem;align-items:flex-start;padding:.5rem 0;border-bottom:1px solid var(--linea)}
.it:last-of-type{border-bottom:0}
.it .txt{flex:1;cursor:text;overflow-wrap:anywhere}.it.hecho .txt{text-decoration:line-through;color:var(--suave)}
.it input.edit{flex:1;padding:.3rem .55rem}
.it .x{padding:0 .45rem;background:transparent;font-size:1.2rem;color:var(--tenue);line-height:1.3}
.it .x:hover{color:var(--vencida);background:transparent}
.it input[type=checkbox],input.rd{margin-top:.1rem}
.addps{display:flex;gap:.4rem;margin-top:.7rem}.addps input{padding:.5rem .75rem;font-size:.9rem}
.vacioit{color:var(--tenue);font-size:.88rem;margin:.2rem 0}
/* Horario */
.tabla{overflow-x:auto;padding:.7rem}
table.horario{border-collapse:separate;border-spacing:.4rem;width:100%;min-width:42rem}
.horario th{font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;color:var(--suave);padding:.5rem;text-align:center}
.horario th.hoy{color:var(--acento)}
.horario td{border-radius:14px;padding:.85rem .5rem;text-align:center;vertical-align:middle;font-size:.9rem;font-weight:600;line-height:1.3}
.horario td.h{color:var(--suave);font-weight:500;font-size:.78rem;white-space:nowrap;text-align:left;width:5.8rem;padding:.5rem}
.horario td.c{background:color-mix(in srgb,var(--color) 22%,transparent);border:1px solid color-mix(in srgb,var(--color) 45%,transparent)}
.horario td.c.hoy{background:color-mix(in srgb,var(--color) 40%,transparent)}
.horario td.rec{color:var(--tenue);font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;padding:.2rem;font-weight:600;background:var(--capa)}
.horario tr.ahora td.h{color:var(--acento);font-weight:700}
/* Edición */
.blk{display:flex;flex-direction:column}.blk>.card,.blk>details.card{flex:1}
.blk.oculto{opacity:.5}
.ctlb{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;margin:0 .2rem .4rem}
.ctlb span:last-child{display:flex;gap:.3rem;flex-wrap:wrap}
.barraLay{display:flex;gap:.5rem;margin:0 .2rem 1rem;justify-content:flex-end}
input.cp{width:3.4rem;height:2.5rem;padding:.15rem;cursor:pointer;border-radius:12px}
.tbar{display:flex;gap:.3rem;flex-wrap:wrap;margin:.3rem 0 .5rem}
.cuerpo.ed{min-height:10rem;background:rgb(var(--vid)/.45);border:1px solid var(--linea);border-radius:14px;padding:1rem 1.2rem;outline:none}
.cuerpo.ed:focus{border-color:var(--acento)}
.barraEd{display:flex;gap:.4rem;flex-wrap:wrap;padding:.8rem 1.4rem 1.1rem;border-top:1px solid var(--linea)}
.horario select,.horario input[type=time]{padding:.4rem .5rem;font-size:.85rem;border-radius:10px}
.horario td.h .hf{display:grid;gap:.3rem}
.horario td.h label{font-size:.75rem;display:flex;gap:.4rem;align-items:center}

const lunes=(d=new Date())=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const clavSem=(d)=>{const x=lunes(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const itemsSem=(k=clavSem())=>plansem[k]||(plansem[k]=[]);
const idxHoy=()=>(new Date().getDay()+6)%7;
const hm=(t)=>{const [h,m]=t.split(":").map(Number);return h*60+m};
const HORAS_DEF=[["15:00","15:55"],["15:55","16:50"],["16:50","17:45"],["17:45","18:05"],["18:05","19:00"],["19:00","19:55"],["19:55","20:50"]];
const HORARIO_DEF=[ // columnas: lunes a viernes; null = recreo
 ["ad","pim","pmdm","nube","sge"],
 ["ad","nube","pmdm","nube","sge"],
 ["sos","pmdm","pim","di",""],
 null,
 ["pim","pmdm","dig","",""],
 ["di","ad","sge","sge","psp"],
 ["di","ad","di","sge","psp"]];
if(!horario)horario=P.base?{horas:HORAS_DEF.map((x)=>[...x]),filas:HORARIO_DEF.map((r)=>r?[...r]:null)}:{horas:[],filas:[]};
function bloquesDia(d){const out=[],HO=horario.horas,FI=horario.filas;if(d>4)return out;
 for(let r=0;r<HO.length;r++){const row=FI[r];if(!row||!row[d])continue;const id=row[d],u=out[out.length-1];
  if(u&&u.id===id&&u.r===r-1){u.fin=HO[r][1];u.r=r}else out.push({id,ini:HO[r][0],fin:HO[r][1],r})}return out}
function htmlClases(d){const bl=bloquesDia(d),n=new Date(),min=n.getHours()*60+n.getMinutes();
 if(!bl.length)return `<p class="estado">${d>4?"Fin de semana: no hay clases.":"Hoy no tienes clases."}</p>`;
 return bl.map((b)=>{const a=asig(b.id)||{color:"#888",nombre:b.id},est=min>=hm(b.fin)?"pasada":min>=hm(b.ini)?"ahora":"";
  return `<div class="cl ${est}" style="--color:${a.color}"><span class="b"></span><span class="h">${b.ini} – ${b.fin}</span><span><b>${esc(a.nombre)}</b>${est==="ahora"?'<span class="etq">Ahora</span>':""}</span></div>`}).join("")}
function itemHtml(i){return `<div class="it ${i.hecho?"hecho":""}"><input type="checkbox" data-pi="${i.id}" ${i.hecho?"checked":""} aria-label="Hecho">${editandoPi===i.id?`<input class="edit" id="editPi" value="${esc(i.texto)}" maxlength="120">`:`<span class="txt" data-epi="${i.id}" title="Pulsa para editar">${esc(i.texto)}</span>`}<button class="x" data-xpi="${i.id}" aria-label="Borrar">×</button></div>`}
const formAdd=(d)=>`<form class="addps" data-dia="${d}"><input placeholder="Añadir tarea…" maxlength="120" aria-label="Nueva tarea"><button class="peq pri">Añadir</button></form>`;
function htmlDia(d){const its=itemsSem().filter((i)=>i.dia===d);return (its.length?its.map(itemHtml).join(""):'<p class="vacioit">Nada planificado.</p>')+formAdd(d)}

function vHorario(){const hoy=idxHoy(),n=new Date(),min=n.getHours()*60+n.getMinutes(),skip=[0,0,0,0,0],HO=horario.horas,FI=horario.filas;

 const opts=(sel)=>`<option value="">—</option>`+TODAS.map((a)=>`<option value="${a.id}" ${a.id===sel?"selected":""}>${esc(a.corto)}</option>`).join("");
 for(let r=0;r<HO.length;r++){
  if(editHor){const rec=!FI[r];
   h+=`<tr><td class="h"><div class="hf"><input type="time" data-hi="${r}" value="${HO[r][0]}" aria-label="Inicio"><input type="time" data-hf="${r}" value="${HO[r][1]}" aria-label="Fin"><label><input type="checkbox" class="rd" data-hrec="${r}" ${rec?"checked":""}>Recreo</label><button class="peq rojo" data-hdel="${r}">Quitar fila</button></div></td>`;
   if(rec)h+='<td class="rec" colspan="5">Recreo</td></tr>';else{for(let c=0;c<5;c++)h+=`<td><select data-hc="${r},${c}" aria-label="${DIAS[c]}">${opts(FI[r][c])}</select></td>`;h+="</tr>"}continue}
  const act=min>=hm(HO[r][0])&&min<hm(HO[r][1])&&hoy<5;
  h+=`<tr class="${act?"ahora":""}"><td class="h">${HO[r][0]} – ${HO[r][1]}</td>`;
  if(!FI[r]){h+='<td class="rec" colspan="5">Recreo</td></tr>';continue}
  for(let c=0;c<5;c++){if(skip[c]>0){skip[c]--;continue}const id=FI[r][c];if(!id){h+="<td></td>";continue}

   else if(c==="pre")document.execCommand("insertHTML",false,'<pre data-lang="java"><code>'+E(sel||"// código")+"</code></pre><p><br></p>");
   else if(c==="nota")document.execCommand("insertHTML",false,'<div class="nota"><span class="nl">Consejo</span>'+E(sel||"Escribe la nota")+"</div><p><br></p>")}});
  $("nVerHtml").onclick=()=>{const ta=$("nH");if(ta.hidden){ta.value=nc.innerHTML;ta.hidden=false;nc.hidden=true}else{nc.innerHTML=limpiar(ta.value);ta.hidden=true;nc.hidden=false}};
  $("nCancel").onclick=()=>{if(tm.nuevo)notas.extra[tm.a]=(notas.extra[tm.a]||[]).filter((x)=>x.id!==tm.id);edNota=null;guardarNotas();pintar()};
  $("nGuardar").onclick=()=>{const html=limpiar($("nH").hidden?nc.innerHTML:$("nH").value),t=$("nT").value.trim()||"Sin título",r=$("nR").value.trim();
   if(a.temas[tm.id]){(notas.ov[a.id]=notas.ov[a.id]||{})[tm.id]={t,resumen:r,html}}else{const x=(notas.extra[a.id]||[]).find((y)=>y.id===tm.id);if(x){x.t=t;x.resumen=r;x.html=html;const ss=$("nS");if(ss)x.sem=ss.value}}
   edNota=null;guardarNotas();pintar()};nc.focus()}
 // Cuenta
 document.querySelectorAll("[data-pn]").forEach((i)=>i.onchange=()=>{nombres[i.dataset.pn]=i.value.trim()||PERFILES.find((x)=>x.id===i.dataset.pn).defecto;LSG.set("perfiles",nombres);pintar()});
 const cc=$("cuCambiar");if(cc){cc.onclick=()=>{LSG.del("perfil");location.reload()};$("cuSalir").onclick=cerrarSesion}
 // Organización semanal
 const ps=(id)=>itemsSem().find((i)=>i.id===id);
 document.querySelectorAll("[data-pi]").forEach((c)=>c.addEventListener("change",()=>{const i=ps(c.dataset.pi);if(i){i.hecho=c.checked;guardarPs();pintar()}}));
 document.querySelectorAll("[data-xpi]").forEach((b)=>b.onclick=()=>{plansem[clavSem()]=itemsSem().filter((i)=>i.id!==b.dataset.xpi);guardarPs();pintar()});
 document.querySelectorAll("[data-epi]").forEach((b)=>b.onclick=()=>{editandoPi=b.dataset.epi;pintar()});
 const ed=$("editPi");if(ed){ed.focus();ed.select();const fin=(ok)=>{if(editandoPi===null)return;const i=ps(editandoPi);if(ok&&i&&ed.value.trim()){i.texto=ed.value.trim();guardarPs()}editandoPi=null;pintar()};
  ed.addEventListener("keydown",(e)=>{if(e.key==="Enter")fin(true);else if(e.key==="Escape")fin(false)});ed.addEventListener("blur",()=>fin(true))}
 document.querySelectorAll(".addps").forEach((f)=>f.addEventListener("submit",(e)=>{e.preventDefault();const t=f.querySelector("input").value.trim();if(!t)return;
  itemsSem().push({id:"p"+Date.now()+Math.random().toString(36).slice(2,6),dia:+f.dataset.dia,texto:t,hecho:false});guardarPs();pintar()}));
 const pc=$("psCopiar");if(pc){pc.onclick=()=>{const d=new Date();d.setDate(d.getDate()-7);const prev=plansem[clavSem(d)]||[];if(!prev.length){alert("La semana anterior no tiene tareas.");return}
  prev.forEach((i)=>itemsSem().push({...i,id:"p"+Date.now()+Math.random().toString(36).slice(2,6),hecho:false}));guardarPs();pintar()};
  $("psVaciar").onclick=()=>{if(confirm("¿Vaciar la organización de esta semana?")){plansem[clavSem()]=[];guardarPs();pintar()}}}
 // Apariencia
 document.querySelectorAll("[data-ap]").forEach((b)=>b.onclick=()=>{ap[b.dataset.ap]=b.dataset.v;guardarAp();pintar()});
 document.querySelectorAll("[data-fondo]").forEach((b)=>b.onclick=()=>{ap.fondo=b.dataset.fondo;guardarAp();pintar()});
 const ac=$("apColor");if(ac)ac.addEventListener("input",()=>{ap.acento=ac.value;guardarAp()});
 document.querySelectorAll("[data-acento]").forEach((b)=>b.onclick=()=>{ap.acento=b.dataset.acento;guardarAp();pintar()});
 document.querySelectorAll("[data-rng]").forEach((r)=>r.addEventListener("input",()=>{const k=r.dataset.rng,v=parseFloat(r.value);ap[k]=v;guardarAp();$("o_"+k).textContent=FMT[k](v)}));
 const sub=$("apSubir");if(sub){sub.onclick=()=>$("apFile").click();
  $("apFile").onchange=async(e)=>{const f=e.target.files[0];if(!f)return;try{const d=await reducirImagen(f);await opBD("readwrite",(s)=>s.put(d,KFONDO));imgFondo=d;ap.fondo="img";guardarAp();pintar()}catch(x){alert("No se pudo usar esa imagen")}};
  const q=$("apQuitarImg");if(q)q.onclick=async()=>{try{await opBD("readwrite",(s)=>s.delete(KFONDO))}catch(e){}imgFondo=null;if(ap.fondo==="img")ap.fondo="aurora";guardarAp();pintar()};
  $("apUsarUrl").onclick=()=>{const u=$("apUrl").value.trim();if(/^https?:\/\//i.test(u)){ap.url=u;ap.fondo="url";guardarAp();pintar()}else alert("Pega una dirección que empiece por https://")};
  $("apReset").onclick=()=>{ap={...AP_DEF};guardarAp();pintar()}}
 const aj=$("fAj");if(aj){aj.addEventListener("submit",(e)=>{e.preventDefault();repo=$("ajRepo").value.trim()||repo;const t=$("ajTok").value.trim();if(t)token=t;LSG.set("repo",repo);LSG.set("token",token);if(token&&mod===0){mod=Date.now();guardarLocal();pendiente=true}sha=null;estadoSync("guardando");sincronizar().then(()=>{location.hash="#inicio"})});
  const q=$("ajQuitar");if(q)q.onclick=()=>{token="";LSG.set("token","");estadoSync("local");pintar()}}
 const f=$("fEx");if(f){f.addEventListener("submit",(e)=>{e.preventDefault();const o={id:editando||"ex"+Date.now(),asig:$("exAsig").value,titulo:$("exTit").value.trim(),fecha:$("exFecha").value,aprox:false,notas:$("exNotas").value.trim()};
  examenes=editando?examenes.map((x)=>x.id===editando?o:x):[...examenes,o];editando=null;guardarEx();pintar()});
  const c=$("exCancel");if(c)c.onclick=()=>{editando=null;pintar()};
  document.querySelectorAll("[data-del]").forEach((b)=>b.onclick=()=>{if(confirm("¿Borrar este examen?")){examenes=examenes.filter((x)=>x.id!==b.dataset.del);guardarEx();pintar()}});
  document.querySelectorAll("[data-edit]").forEach((b)=>b.onclick=()=>{editando=b.dataset.edit;pintar();scrollTo(0,document.body.scrollHeight)});
  $("exExp").onclick=()=>{const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([JSON.stringify({...estadoObj(),notas},null,1)],{type:"application/json"}));l.download="panel-datos.json";l.click()};
  $("exImp").onclick=()=>$("exFile").click();
  $("exFile").onchange=async(e)=>{try{const j=JSON.parse(await e.target.files[0].text());volcar(j);if(j.notas){notas=j.notas;LS.set("notas",notas)}cambio();pintar()}catch(x){alert("Archivo no válido")}}}}

function pintarPerfiles(){$("listaPerfiles").innerHTML=PERFILES.map((x)=>`<button type="button" class="card perfilBtn" data-perfil="${x.id}"><span class="logo" style="--color:${x.color}">${esc(nombrePerfil(x.id).charAt(0).toUpperCase())}</span><h3>${esc(nombrePerfil(x.id))}</h3></button>`).join("");
 document.querySelectorAll("[data-perfil]").forEach((b)=>b.onclick=()=>{LSG.set("perfil",b.dataset.perfil);location.reload()})}
async function entrar(k,p){datos=await descifrar(k,p);clave=k;if(!ELEGIDO){pintarPerfiles();mostrar("perfiles");return}plan=await cargarPlan(k);mostrar("panel");pintar();estadoSync(token?"guardando":"local");sincronizar()}
async function cerrarSesion(){try{await borrarClave()}catch(e){}clave=null;datos=null;location.reload()}
async function iniciar(){try{paquete=await traer("tareas.enc",true)}catch(e){$("cargando").textContent="No se pudo cargar el panel. Recarga en un momento.";return}
 let g=null;try{g=await leerClave()}catch(e){}
 if(g&&!(g.usages||[]).includes("encrypt")){try{await borrarClave()}catch(e){}g=null}
 if(g){try{await entrar(g,paquete);return}catch(e){try{await borrarClave()}catch(e2){}}}mostrar("acceso")}
$("formulario").addEventListener("submit",async(e)=>{e.preventDefault();const c=$("clave");if(!c.value)return;$("entrar").disabled=true;$("mensaje").textContent="Comprobando…";
 try{const k=await derivarClave(c.value);await entrar(k,paquete);try{await guardarClave(k)}catch(e2){}c.value="";$("mensaje").textContent=""}catch(e3){$("mensaje").textContent="Contraseña incorrecta."}$("entrar").disabled=false});
document.querySelectorAll("#menu [data-v]").forEach((b)=>b.addEventListener("click",()=>{if(location.hash==="#"+b.dataset.v)pintar();else location.hash="#"+b.dataset.v}));
addEventListener("hashchange",()=>{if(clave){edNota=null;pintar();if(!location.hash.split("/")[2])scrollTo(0,0)}});
setInterval(async()=>{if(!clave)return;let n;try{n=await traer("tareas.enc",true)}catch(e){return}try{datos=await descifrar(clave,n);paquete=n;plan=await cargarPlan(clave);if(!enEdicion())pintar()}catch(e){cerrarSesion()}},5*60*1000);
setInterval(()=>{if(clave&&!enEdicion())pintar()},60*1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)sincronizar()});
setInterval(()=>sincronizar(),5*60*1000);
iniciar();
</script></body></html>
