name: Avisos al móvil

# Cada 15 minutos mira tus entregas, exámenes y eventos, y manda las notificaciones que hayas
# configurado en la web (Ajustes > Notificaciones). Funciona aunque tu PC esté apagado.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:          # botón "Run workflow": además manda un aviso de prueba

permissions:
  contents: read

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install cryptography pywebpush

      # Recuerda de qué ya te avisó, para no repetir notificaciones
      - uses: actions/cache@v4
        with:
          path: .estado
          key: avisos-${{ github.run_id }}
          restore-keys: avisos-

      - name: Revisar y avisar
        env:
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python avisos.py ${{ github.event_name == 'workflow_dispatch' && 'probar' || '' }}
