name: Actualizar dashboard

# GitHub solo publica la web. Los datos (ya cifrados) los sube tu PC con ia_diaria.py.
on:
  push:
    branches: [main]
  workflow_dispatch:          # botón para lanzarlo a mano

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: despliegue
        uses: actions/deploy-pages@v4
